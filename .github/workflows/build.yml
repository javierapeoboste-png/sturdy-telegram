name: Ultra TV - Generar APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar Ultra TV
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Instalar Gradle
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # 4. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 5. Instalar SDK Android
      - name: Instalar Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 6. Buscar el ZIP
      - name: Comprobar archivos
        run: |
          echo "Archivos del repositorio:"
          ls -lah

      # 7. Crear carpeta del proyecto
      - name: Crear carpeta UltraTV
        run: |
          rm -rf ultratv
          mkdir -p ultratv

      # 8. Descomprimir proyecto
      - name: Descomprimir UltraTV
        run: |
          unzip -o UltraTV-GitHub-logo-FIX.zip -d ultratv

      # 9. Mostrar estructura
      - name: Comprobar estructura
        run: |
          echo "Estructura del proyecto:"
          find ultratv -maxdepth 4 -type f | sort

      # 10. Verificar archivos importantes
      - name: Verificar proyecto Android
        run: |
          test -f ultratv/settings.gradle.kts
          test -f ultratv/build.gradle.kts
          test -f ultratv/app/build.gradle.kts
          test -f ultratv/app/src/main/AndroidManifest.xml
          test -f ultratv/app/src/main/java/com/ultratv/app/MainActivity.kt

          echo "Proyecto Android correcto."

      # 11. Compilar APK
      - name: Generar APK
        working-directory: ultratv
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      # 12. Comprobar APK
      - name: Comprobar APK generado
        run: |
          ls -lh ultratv/app/build/outputs/apk/debug/
          test -f ultratv/app/build/outputs/apk/debug/app-debug.apk

      # 13. Subir APK a GitHub
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraTV-APK
          path: ultratv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
